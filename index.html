<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kobby Voice Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <div class="display">
                <div class="header">
                    <button id="mic-btn" class="mic-btn" aria-label="Microphone">🎤</button>
                    <div class="status-container">
                        <div id="status">Click mic to speak</div>
                        <div id="transcript"></div>
                    </div>
                </div>
                <div class="screen">
                    <div id="history"></div>
                    <div id="result">0</div>
                </div>
            </div>
            <div class="buttons">
                <button class="btn action" data-action="clear">C</button>
                <button class="btn action" data-action="delete">DEL</button>
                <button class="btn operator" data-value="%">%</button>
                <button class="btn operator" data-value="/">/</button>

                <button class="btn number" data-value="7">7</button>
                <button class="btn number" data-value="8">8</button>
                <button class="btn number" data-value="9">9</button>
                <button class="btn operator" data-value="*">*</button>

                <button class="btn number" data-value="4">4</button>
                <button class="btn number" data-value="5">5</button>
                <button class="btn number" data-value="6">6</button>
                <button class="btn operator" data-value="-">-</button>

                <button class="btn number" data-value="1">1</button>
                <button class="btn number" data-value="2">2</button>
                <button class="btn number" data-value="3">3</button>
                <button class="btn operator" data-value="+">+</button>

                <button class="btn number" data-value="00">00</button>
                <button class="btn number" data-value="0">0</button>
                <button class="btn number" data-value=".">.</button>
                <button class="btn action equal" data-action="equal">=</button>
            </div>
        </div>
        <footer>K_Calculator | GCTU | Kobby Voice Calc</footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
